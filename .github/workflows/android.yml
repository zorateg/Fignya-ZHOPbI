name: Android APK / AAB

# Собирает установочный .apk (и .aab для Google Play, если настроен ключ подписи).
# Запуск: вкладка Actions -> "Android APK / AAB" -> Run workflow.
# Результат: раздел Artifacts внизу страницы запуска.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Адрес сайта, который будет открывать приложение (https://...). Можно оставить пустым."
        required: false
        default: ""
      version_name:
        description: "Версия (например 1.0.1)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Номер сборки (целое, каждый раз больше предыдущего)"
        required: false
        default: "1"
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "master"
    paths:
      - "mobile-www/**"
      - "android/**"
      - "assets/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi
          echo "SDK: $ANDROID_SDK_ROOT"

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Адрес сервера приложения
        env:
          INPUT_URL: ${{ inputs.app_url }}
          VARS_URL: ${{ vars.APP_URL }}
        run: |
          URL="${INPUT_URL:-$VARS_URL}"
          if [ -n "$URL" ]; then
            node scripts/set-app-url.js "$URL"
            echo "Приложение будет открывать: $URL"
          else
            echo "::warning::APP_URL не задан — приложение спросит адрес сервера при первом запуске."
          fi

      - name: Синхронизация веб-слоя с Android-проектом
        run: npx cap sync android

      - name: Ключ подписи (если добавлен в Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ключ подписи найден — соберём подписанный релиз."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ключ подписи не настроен — соберём debug APK (его можно ставить на телефон, но не публиковать в Google Play)."
          fi

      - name: Сборка APK (debug, ставится на телефон)
        env:
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Сборка подписанного релиза (APK + AAB)
        if: steps.keystore.outputs.signed == 'true'
        env:
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Переименовать и собрать артефакты
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/fignya-debug.apk" || true
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/fignya-release.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/fignya-release.aab"
          fi
          ls -lh dist

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: fignya-android
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Приложить APK к релизу (при пуше тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "Фигня $TAG" --notes "Сборка Android из GitHub Actions." || \
          gh release upload "$TAG" dist/* --clobber
