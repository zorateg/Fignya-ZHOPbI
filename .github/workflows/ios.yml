name: iOS build (iPhone / iPad)

# Проверяет, что iOS-проект собирается, и отдаёт .app (без подписи).
# Для App Store нужен Mac + Xcode + аккаунт Apple Developer — см. MOBILE.md.
# Запуск: Actions -> "iOS build (iPhone / iPad)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Адрес сайта, который будет открывать приложение (https://...)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "ios/**"
      - "mobile-www/**"
      - "assets/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Адрес сервера приложения
        env:
          INPUT_URL: ${{ inputs.app_url }}
          VARS_URL: ${{ vars.APP_URL }}
        run: |
          URL="${INPUT_URL:-$VARS_URL}"
          if [ -n "$URL" ]; then
            node scripts/set-app-url.js "$URL"
            echo "Приложение будет открывать: $URL"
          else
            echo "::warning::APP_URL не задан — приложение спросит адрес сервера при первом запуске."
          fi

      - name: Синхронизация веб-слоя с iOS-проектом
        run: npx cap sync ios

      - name: Сборка (без подписи)
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -list -project App.xcodeproj
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/../../build" \
            CONFIGURATION_BUILD_DIR="$PWD/../../build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковать артефакт
        run: |
          mkdir -p dist
          cd build/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/dist/fignya-ios-unsigned.ipa" App.app
          cd "$GITHUB_WORKSPACE"
          ls -lh dist

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: fignya-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 90
