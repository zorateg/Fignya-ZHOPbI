<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070510" />
    <title>Фигня</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="glow"></div>

      <header class="brand">
        <div class="crown">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M3 8.5l4 3 3.5-5.5L14 11.5l4-3-1.4 9.5H4.4L3 8.5Z"
              fill="#fff"
              fill-opacity="0.95"
            />
            <circle cx="3" cy="6.5" r="1.6" fill="#fff" fill-opacity="0.95" />
            <circle cx="12" cy="4" r="1.6" fill="#fff" fill-opacity="0.95" />
            <circle cx="21" cy="6.5" r="1.6" fill="#fff" fill-opacity="0.95" />
          </svg>
        </div>
        <h1>Жора Крутой представляет <span class="grad">Фигню</span></h1>
        <p class="sub">Мы не знаем, что это. Вы не знаете, зачем это. Но вы уже открыли приложение.</p>
      </header>

      <section id="setup" class="card" hidden>
        <label for="url">Адрес сервера приложения</label>
        <input
          id="url"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://fignya.vercel.app"
        />
        <button id="go" type="button">Открыть приложение</button>
        <p id="err" class="err" role="alert" hidden></p>
        <p class="hint">
          Адрес выдаётся тому, кто развернул сайт (например, адрес на Vercel).
          Он сохранится на этом устройстве.
        </p>
      </section>

      <section id="loading" class="card center">
        <div class="spinner"></div>
        <p class="hint">Открываем приложение…</p>
        <button id="change" type="button" class="link">Сменить адрес сервера</button>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
